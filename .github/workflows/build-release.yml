name: Build and Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_VERSION: '10.0.x'
  VPK_VERSION: '1.2.161'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main. Merge to main first, then tag there."
            exit 1
          fi

      - name: Check the tag matches the launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(sed -nE 's/.*CurrentLauncherVersion = new\(\) \{ Major = ([0-9]+), Minor = ([0-9]+), Build = ([0-9]+).*/\1.\2.\3/p' LoE-Launcher/Core/Downloader.cs)
          if [ "$actual" != "$expected" ]; then
            echo "::error file=LoE-Launcher/Core/Downloader.cs::Tag $GITHUB_REF_NAME doesn't match CurrentLauncherVersion ($actual)"
            exit 1
          fi
          echo "Launcher version $actual matches the tag"

      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=minimal"

  build:
    name: Build ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: build-windows.sh
            output: Publish/Windows
          - name: macOS
            os: macos-latest
            script: build-mac.sh
            output: Publish/Mac
          - name: Linux
            os: ubuntu-latest
            script: build-linux.sh
            output: Publish/Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install vpk
        run: dotnet tool install --global vpk --version ${{ env.VPK_VERSION }}

      - name: Build and package
        shell: bash
        run: bash .github/scripts/${{ matrix.script }}
        env:
          MACOS_CERTIFICATE_P12: ${{ matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          NOTARIZATION_APPLE_ID: ${{ matrix.name == 'macOS' && secrets.NOTARIZATION_APPLE_ID || '' }}
          NOTARIZATION_PASSWORD: ${{ matrix.name == 'macOS' && secrets.NOTARIZATION_PASSWORD || '' }}
          NOTARIZATION_TEAM_ID: ${{ matrix.name == 'macOS' && secrets.NOTARIZATION_TEAM_ID || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.output }}/*
          if-no-files-found: error

  flatpak:
    name: Build Flatpak
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: bash .github/scripts/build-flatpak.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: LoE-Launcher-linux.flatpak
          manifest-path: com.loe.Launcher.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-Flatpak
          path: LoE-Launcher-linux.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Check release files
        working-directory: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -lh
          for file in LoE-Launcher-win-Setup.exe LoE-Launcher-osx-Setup.pkg LoE-Launcher.AppImage LoE-Launcher-linux.flatpak; do
            [ -f "$file" ] || { echo "::error::Missing $file"; exit 1; }
          done
          for channel in win osx linux; do
            feed="releases.$channel.json"
            [ -f "$feed" ] || { echo "::error::Missing $feed"; exit 1; }
            jq -e --arg v "$version" '.Assets | length > 0 and all(.Version == $v and .PackageId == "LoE-Launcher")' "$feed" > /dev/null \
              || { echo "::error::$feed doesn't list LoE-Launcher $version"; cat "$feed"; exit 1; }
          done

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
